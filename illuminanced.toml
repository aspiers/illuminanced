[daemonize]
# log_to = "syslog" or /file/path
log_to = "syslog"
pid_file = "/var/run/illuminanced.pid"
# log_level = "OFF", "ERROR", "WARN", "INFO", "DEBUG", "TRACE"
log_level = "ERROR"

# https://github.com/mikhail-m1/illuminanced/issues/12
# Backlight brightness levels are remapped from
# [min_backlight, max_backlight_file] to [0, light_steps]
[general]
check_period_in_seconds = 2
light_steps = 10
min_backlight = 10000
step_barrier = 0.1
#max_backlight_file = "/sys/class/backlight/intel_backlight/max_brightness"
max_backlight_file = "/sys/class/backlight/amdgpu_bl1/max_brightness"
#backlight_file = "/sys/class/backlight/intel_backlight/brightness"
backlight_file = "/sys/class/backlight/amdgpu_bl1/brightness"
illuminance_file = "/sys/bus/iio/devices/iio:device0/in_illuminance_raw"
event_device_mask = "/dev/input/event*"
event_device_name = "Asus WMI hotkeys"
enable_max_brightness_mode = true
filename_for_sensor_activation = ""

[kalman]
q = 1
r = 20
covariance = 10

[light]
# Number of illuminance_n points below
points_count = 6

# Each illuminance_n value is a value from illuminance_file indicating
# the ambient light levels.  0 means the darkest environment.
illuminance_0 = 0
# Each light_n value represents the normalised backlight brightness
# in the range [0, light_steps]
light_0 = 0

illuminance_1 = 20
light_1 = 2

illuminance_2 = 200
light_2 = 4

illuminance_3 = 700
light_3 = 5

illuminance_4 = 1100
light_4 = 9

illuminance_5 = 3984
light_5 = 10

